<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Choice Study</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#F7F5F0;--surface:#FFF;--border:rgba(0,0,0,0.1);
  --text:#1A1A1A;--muted:#6B6B6B;
  --accent:#2D6A4F;--accent-light:#E8F5EE;
  --user-bg:#2D6A4F;--user-txt:#FFF;
  --radius:18px;--cr:12px;--font:'DM Sans',sans-serif;
}
html,body{height:100%;}
body{font-family:var(--font);background:var(--bg);color:var(--text);height:100%;display:flex;justify-content:center;overflow:hidden;}
.shell{width:100%;max-width:900px;height:100%;background:var(--surface);display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,0.12);margin:0 auto;overflow:hidden;}

/* HEADER */
.header{padding:clamp(4px,2vh,18px) 20px clamp(4px,1.5vh,14px);border-bottom:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:clamp(4px,1vh,10px);background:var(--surface);flex-shrink:1;min-height:0;overflow:hidden;}
.av-large{width:clamp(48px,min(13vw,14vh),120px);height:clamp(48px,min(13vw,14vh),120px);border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#eee;flex-shrink:1;}
.av-large img{width:100%;height:100%;object-fit:cover;object-position:center top;border-radius:50%;}
.header-name{font-size:clamp(11px,min(1.8vw,1.8vh),17px);font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;}
.header-status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;}
.odot{width:7px;height:7px;border-radius:50%;background:#52b788;display:inline-block;}

/* CHAT */
.chat-area{flex:1;min-height:0;overflow-y:auto;padding:clamp(12px,2vw,20px) clamp(12px,2.5vw,24px) 80px;display:flex;flex-direction:column;gap:clamp(8px,1.2vw,12px);scroll-behavior:smooth;}
.msg-row{display:flex;align-items:flex-start;gap:7px;animation:fadeUp .22s ease both;}
.msg-row.user{flex-direction:row-reverse;}
.bot-icon{width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;border:1px solid var(--border);background:#eee;}
.bot-icon img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.bubble-widget{flex:1;min-width:0;padding:clamp(10px,1.8vw,14px) clamp(12px,2vw,18px);border-radius:var(--radius);background:#fff;border:1px solid var(--border);border-top-left-radius:4px;}
.bubble{max-width:72%;padding:clamp(10px,1.8vw,14px) clamp(12px,2vw,18px);border-radius:var(--radius);font-size:clamp(15px,2.2vw,19px);line-height:1.60;color:var(--text);background:#fff;border:1px solid var(--border);border-top-left-radius:4px;}
.msg-row.user .bubble{background:var(--user-bg);color:var(--user-txt);border-color:var(--user-bg);border-top-left-radius:var(--radius);border-bottom-left-radius:var(--radius);border-bottom-right-radius:var(--radius);border-top-right-radius:4px;}
.typing{display:inline-flex;gap:4px;align-items:center;padding:4px 2px;}
.typing span{width:6px;height:6px;background:#bbb;border-radius:50%;animation:blink 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;}.typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.3;transform:scale(.85);}40%{opacity:1;transform:scale(1);}}

/* MENU WIDGET */
.course-widget{display:flex;flex-direction:column;gap:9px;width:100%;}
.course-lbl{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.menu-list{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.mcard{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--cr);padding:clamp(9px,1.5vw,14px) clamp(8px,1.5vw,13px);cursor:pointer;transition:border-color .14s,background .12s;display:flex;flex-direction:column;justify-content:space-between;min-height:clamp(130px,18vw,170px);position:relative;user-select:none;}
.mcard:hover{border-color:var(--accent);}
.mcard.sel{border-color:var(--accent);background:var(--accent-light);}
.mcheck{position:absolute;top:7px;right:7px;width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(0,0,0,0.18);background:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;transition:all .12s;}
.mcard.sel .mcheck{background:var(--accent);border-color:var(--accent);color:#fff;}
.memoji{font-size:clamp(22px,3vw,30px);line-height:1;}
.mbody{display:contents;}
.mname{font-size:clamp(12px,1.8vw,15px);font-weight:600;color:var(--text);line-height:1.3;}
.mdesc{font-size:clamp(11px,1.5vw,13px);color:var(--muted);line-height:1.35;}
.mstats{display:flex;gap:4px;margin-top:auto;padding-top:6px;flex-wrap:wrap;}
.pill{font-size:clamp(10px,1.4vw,13px);padding:clamp(2px,0.4vw,4px) clamp(6px,1vw,10px);border-radius:20px;font-weight:500;white-space:nowrap;}
.pcal{background:#FEF3C7;color:#92400E;}
.ptaste{background:#EDE9FE;color:#5B21B6;}
.cfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px;}
.chint{font-size:12px;color:var(--muted);}
.nbtn{padding:clamp(8px,1.2vw,11px) clamp(16px,2.5vw,24px);border-radius:30px;background:var(--accent);color:#fff;border:none;font-family:var(--font);font-size:clamp(12px,1.6vw,15px);font-weight:500;cursor:pointer;opacity:.35;pointer-events:none;transition:opacity .14s;}
.nbtn.go{opacity:1;pointer-events:auto;}.nbtn.go:hover{opacity:.88;}

/* ORDER SUMMARY */
.osummary {
  display: flex;
  flex-direction: column;
  gap: 5px;
  width: 100%;
  /* 480px 제한을 풀어서 화면(말풍선)이 넓어지면 같이 넓어지게 만듭니다 */
  max-width: 100%; 
}
.ohead {
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .05em;
  margin-top: 6px;
}
.oitem {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 0;
  border-bottom: 1px solid var(--border);
  font-size: clamp(13px, 1.8vw, 16px);
  /* 메뉴명이 불필요하게 단어 중간에서 뚝뚝 끊기지 않도록 방지합니다 */
  word-break: keep-all; 
}
.oitem:last-child {
  border-bottom: none;
}
.fc {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 8px;
}
.fc button {
  padding: 11px 20px;
  border-radius: 30px;
  font-family: var(--font);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  border: 1.5px solid var(--accent);
  transition: all .14s;
}
.byes { background: var(--accent); color: #fff; }
.byes:hover { opacity: .88; }
.bno { background: #fff; color: var(--accent); }
.bno:hover { background: var(--accent-light); }

/* DONE */
.done-card {
  background: var(--accent-light);
  border: 1.5px solid var(--accent);
  border-radius: var(--cr);
  padding: clamp(24px, 4vw, 40px); 
  text-align: center; 
  width: 100%; 
  max-width: min(550px, 95%); 
  margin: 0 auto; 
}

.done-card .bchk {
  font-size: 45px; 
  margin-bottom: 12px; 
}

.done-card p {
  font-size: 18px; 
  color: var(--accent); 
  font-weight: 500; 
}

.done-card small {
  font-size: 14px; 
  color: var(--muted); 
}

.done-card button {
  margin-top: 16px; 
  padding: 12px 28px; 
  font-size: 16px; 
  border-radius: 30px; 
  background: var(--accent);
  color: #fff;
  border: none;
  cursor: pointer;
  font-family: inherit;
  transition: opacity 0.14s;
}

.done-card button:hover {
  opacity: 0.88;
}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1A1A1A;color:#fff;font-size:13px;padding:10px 20px;border-radius:30px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:200;white-space:nowrap;}
.toast.show{opacity:1;}

@media (max-width: 480px) {
  .shell { width: 100%; max-width: 100%; }
  .bubble { max-width: 82%; }
  .menu-list { grid-template-columns: 1fr 1fr; gap: 6px; }
  .header { padding: 14px 16px 12px; }
}

</style>
</head>

<script>
/* ═══ ONE-RUN GATE v2 ═══ 완료한 참가자의 재진입만 차단 ═══ */
const GATE = (function () {
  const GATE_URL   = "https://script.google.com/macros/s/AKfycbwmeGuwg4ksoI0Vm0a2OVBv4-SpyJhwrJYUS08-tZWM68dCZvMnXIvZWbZU63rpd6Sl/exec";
  const CONDITION  = "human";
  const TIMEOUT_MS = 8000;
  const FAIL_OPEN  = true;
  const TEST_KEYS  = ["PREVIEW", "TEST"];

  const q = new URLSearchParams(location.search);
  ["pid", "rid"].forEach(k => { const v = q.get(k); if (v) sessionStorage.setItem(k, v); });
  sessionStorage.setItem("condition", CONDITION);

  const PID = (sessionStorage.getItem("pid") || "").trim();
  const RID = (sessionStorage.getItem("rid") || "").trim();
  const KEY = PID || RID;

  const LS_DONE = "foodapp_done_" + KEY;
  const LS_SEEN = "foodapp_seen_" + KEY;
  const SS_TAB  = "foodapp_tab";

  let openType;
  try {
    if (sessionStorage.getItem(SS_TAB))     openType = "refresh";
    else if (localStorage.getItem(LS_SEEN)) openType = "reopen";
    else                                    openType = "first";
    sessionStorage.setItem(SS_TAB, "1");
    localStorage.setItem(LS_SEEN, new Date().toISOString());
  } catch (e) { openType = "unknown"; }

  let openCount = 1, completed = false, blocked = false, lastStage = "opened";

  function injectCss() {
    if (document.getElementById("gateCss")) return;
    const css = document.createElement("style");
    css.id = "gateCss";
    css.textContent = "#gateOverlay{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;background:#f5f6f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}"
      + ".gate-card{max-width:420px;background:#fff;border-radius:16px;padding:32px 28px;box-shadow:0 2px 16px rgba(0,0,0,.08);text-align:center}"
      + ".gate-card h1{font-size:20px;font-weight:650;margin:0 0 14px;color:#1a1c1f}"
      + ".gate-card p{font-size:15px;line-height:1.6;margin:0 0 12px;color:#4a4f57}"
      + ".gate-next{font-weight:600;color:#1a1c1f}"
      + ".gate-meta{font-size:12.5px;color:#8a9099;margin-top:18px}"
      + ".gate-dots{display:flex;gap:6px;justify-content:center}"
      + ".gate-dots i{width:7px;height:7px;border-radius:50%;background:#c3c8cf;animation:gateBounce 1.2s infinite}"
      + ".gate-dots i:nth-child(2){animation-delay:.15s}.gate-dots i:nth-child(3){animation-delay:.3s}"
      + "@keyframes gateBounce{0%,60%,100%{opacity:.35}30%{opacity:1}}"
      + "@media (prefers-reduced-motion:reduce){.gate-dots i{animation:none}}"
      + "html.gate-locked body > *:not(#gateOverlay){display:none!important}";
    document.head.appendChild(css);
  }
  function overlay(html) {
    injectCss();
    let d = document.getElementById("gateOverlay");
    if (!d) { d = document.createElement("div"); d.id = "gateOverlay"; document.body.appendChild(d); }
    d.innerHTML = '<div class="gate-card">' + html + '</div>';
    return d;
  }
  function showLoading() { overlay('<p>Loading your session</p><div class="gate-dots"><i></i><i></i><i></i></div>'); }
  function hideLoading() { const d = document.getElementById("gateOverlay"); if (d) d.remove(); }
  function showBlocked(at) {
    blocked = true;
    document.documentElement.classList.add("gate-locked");
    overlay('<h1>You have already finished this task</h1>'
      + '<p>Your order has been recorded, so this part can only be completed once.</p>'
      + '<p class="gate-next">Return to the survey tab and continue from where you left off.</p>'
      + (at ? '<p class="gate-meta">Completed: ' + at + '</p>' : ''));
  }
  function showNoKey() {
    blocked = true;
    document.documentElement.classList.add("gate-locked");
    overlay('<h1>Session link is incomplete</h1>'
      + '<p>This page needs to be opened from the survey.</p>'
      + '<p class="gate-next">Go back to the survey tab and click the Start button again.</p>');
  }

  function jsonp(params) {
    return new Promise(resolve => {
      const cb = "gate_cb_" + Math.random().toString(36).slice(2);
      const tag = document.createElement("script");
      let settled = false;
      const finish = res => {
        if (settled) return;
        settled = true; clearTimeout(timer);
        try { delete window[cb]; } catch (e) {}
        tag.remove(); resolve(res);
      };
      const timer = setTimeout(() => finish({ status: "timeout" }), TIMEOUT_MS);
      window[cb] = res => finish(res);
      tag.onerror = () => finish({ status: "error" });
      tag.src = GATE_URL + "?" + Object.keys(params)
        .map(k => k + "=" + encodeURIComponent(params[k])).join("&") + "&callback=" + cb;
      document.head.appendChild(tag);
    });
  }

  const ready = (async function () {
    if (!KEY) { console.error("[GATE] rid/pid 없음 — 링크 파라미터를 확인하세요"); showNoKey(); return new Promise(() => {}); }
    if (TEST_KEYS.indexOf(KEY.toUpperCase()) !== -1) { console.warn("[GATE] 테스트 모드"); return; }

    try { const done = localStorage.getItem(LS_DONE); if (done) { showBlocked(done); return new Promise(() => {}); } } catch (e) {}

    showLoading();
    const res = await jsonp({ action: "open", pid: PID, rid: RID, condition: CONDITION, open_type: openType });
    console.log("[GATE]", res);
    if (typeof res.openCount === "number") openCount = res.openCount;

    if (res.status === "completed") {
      try { localStorage.setItem(LS_DONE, res.completedAt || "earlier"); } catch (e) {}
      showBlocked(res.completedAt); return new Promise(() => {});
    }
    if (res.status !== "granted" && !FAIL_OPEN) { showBlocked(""); return new Promise(() => {}); }
    hideLoading();
  })();

  function markComplete() {
    completed = true;
    try { localStorage.setItem(LS_DONE, new Date().toISOString()); } catch (e) {}
  }
  function progress(stage) { lastStage = stage; }

  window.addEventListener("pagehide", function () {
    if (completed || blocked || !KEY) return;
    try {
      navigator.sendBeacon(GATE_URL, JSON.stringify({
        action: "abandon", pid: PID, rid: RID, condition: CONDITION,
        open_type: openType, last_stage: lastStage, at: new Date().toISOString()
      }));
    } catch (e) {}
  });
  window.addEventListener("beforeunload", function (e) {
    if (completed || blocked || !KEY) return;
    e.preventDefault(); e.returnValue = "";
  });

  return { ready: ready, key: KEY, pid: PID, rid: RID, openType: openType,
           get openCount() { return openCount; }, markComplete: markComplete, progress: progress };
})();
</script>

/* ── UTILS ── */
const chatArea = document.getElementById("chatArea");
const wait = ms => new Promise(r => setTimeout(r, ms));
function scrollBottom(){
  setTimeout(()=>{
    chatArea.scrollTo({top: chatArea.scrollHeight, behavior:"smooth"});
  }, 80);
}
function shuffle(a){
  const r=[...a];
  for(let i=r.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [r[i],r[j]]=[r[j],r[i]];
  }
  return r;
}
function showToast(msg,dur=3000){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),dur);
}

/* ── CHAT HELPERS ── */
function makeBotRow(content){
  const row=document.createElement("div"); row.className="msg-row bot";
  const iconWrap=document.createElement("div"); iconWrap.className="bot-icon";
  const iconImg=document.createElement("img"); iconImg.src=HUMAN_SRC; iconImg.alt="assistant";
  iconImg.style.width="100%"; iconImg.style.height="100%";
  iconImg.style.objectFit="cover"; iconImg.style.objectPosition="center 35%";
  iconImg.style.transform="scale(1.3)"; iconImg.style.transformOrigin="center 35%";
  iconWrap.appendChild(iconImg); row.appendChild(iconWrap);
  const bub=document.createElement("div"); bub.className="bubble";
  typeof content==="string"?(bub.innerHTML=content):bub.appendChild(content);
  row.appendChild(bub); return row;
}
function makeTypingRow(){
  const row=makeBotRow("");
  row.querySelector(".bubble").innerHTML='<div class="typing"><span></span><span></span><span></span></div>';
  return row;
}
function addBotBubble(content,delay=900){
  return new Promise(res=>{
    const t=makeTypingRow(); chatArea.appendChild(t); scrollBottom();
    setTimeout(()=>{
      t.remove();
      const row=makeBotRow(content);
      chatArea.appendChild(row);
      lastBotTime=Date.now();
      scrollBottom(); res();
    },delay);
  });
}
function addUserBubble(text){
  const row=document.createElement("div"); row.className="msg-row user";
  const bub=document.createElement("div"); bub.className="bubble"; bub.textContent=text;
  row.appendChild(bub); chatArea.appendChild(row); scrollBottom();
}

/* ── COURSE WIDGET ── */
function makeCourseWidget(course){
  const sel = courseSelections[course.id];
  const items = shuffle(course.items);

  // Record display order
  const orderedNames=items.map(item=>item.name);
  presentedOrders[course.id] = items.map((item,pos)=>({id:item.id,name:item.name,position:pos+1}));
  const sk="session"+sessionCount;
  if(!sessionPresentedOrders[sk]) sessionPresentedOrders[sk]={};
  sessionPresentedOrders[sk][course.id]=orderedNames;

  const wrap=document.createElement("div"); wrap.className="course-widget";
  const lbl=document.createElement("div"); lbl.className="course-lbl"; lbl.textContent=course.label; wrap.appendChild(lbl);
  const list=document.createElement("div"); list.className="menu-list";

  items.forEach((item,posIdx)=>{
    const card=document.createElement("div"); card.className="mcard"; card.dataset.id=item.id;
    card.innerHTML='<div class="mcheck">&#10003;</div><div class="memoji">'+item.emoji+'</div><div class="mbody"><div class="mname">'+item.name+'</div><div class="mdesc">'+item.desc+'</div><div class="mstats"><span class="pill pcal">'+item.cal+' kcal</span><span class="pill ptaste">Taste '+item.taste.toFixed(1)+'/5</span></div></div>';
    card.addEventListener("click",()=>{
      if(phase!=="selecting") return;
      const elapsed=((Date.now()-(runStart||studyStart))/1000).toFixed(1);
      const already=sel.findIndex(s=>s.id===item.id);
      if(already!==-1){
        // same card clicked → deselect
        const removed=sel.splice(already,1)[0];
        globalOrder--;
        fullSelectionLog.push({action:"deselect",course:course.id,item:item.name,
                               type:item.type,pair:item.pair,order:removed.select_order,elapsed_sec:elapsed});
        card.classList.remove("sel");
      } else {
        // different card → deselect previous first
        if(sel.length>0){
          const prev=sel[0];
          sel.splice(0,1);
          globalOrder--;
          fullSelectionLog.push({action:"deselect",course:course.id,item:prev.name,
                                 type:prev.type,pair:prev.pair,order:prev.select_order,elapsed_sec:elapsed});
          const prevCard=list.querySelector(".mcard.sel");
          if(prevCard) prevCard.classList.remove("sel");
        }
        // select new card
        globalOrder++;
        sel.push({id:item.id,name:item.name,type:item.type,pair:item.pair,
                  cal:item.cal,taste:item.taste,select_order:globalOrder,
                  display_position:posIdx+1,timestamp_ms:Date.now()});
        fullSelectionLog.push({action:"select",course:course.id,item:item.name,
                               type:item.type,pair:item.pair,order:globalOrder,
                               display_position:posIdx+1,elapsed_sec:elapsed});
        card.classList.add("sel");
      }
      updateFoot(course.id,hint,nbtn);
    });
    list.appendChild(card);
  });
  wrap.appendChild(list);

  const foot=document.createElement("div"); foot.className="cfoot";
  const hint=document.createElement("span"); hint.className="chint"; hint.textContent="Select at least one item";
  const nbtn=document.createElement("button"); nbtn.className="nbtn";
  nbtn.textContent="Next →";
  nbtn.addEventListener("click",()=>onNext(course));
  foot.appendChild(hint); foot.appendChild(nbtn); wrap.appendChild(foot);
  return wrap;
}

function updateFoot(cid,hint,nbtn){
  const n=courseSelections[cid].length;
  hint.textContent=n===0?"Select at least one item":n===1?"1 item selected":n+" items selected";
  n>0?nbtn.classList.add("go"):nbtn.classList.remove("go");
}


/* ── FLOW ── */
async function onNext(course){
  // compute decision time: from card appearing on screen to Next click
  if(courseShowTimes[course.id]){
    const dt=((Date.now()-courseShowTimes[course.id])/1000).toFixed(1);
    courseDecisionTimes[course.id]=dt;
    const skey="session"+sessionCount;
    if(!sessionDecisionTimes[skey]) sessionDecisionTimes[skey]={};
    sessionDecisionTimes[skey][course.id]=dt;
  }
  phase="selecting";
  chatArea.querySelectorAll(".mcard").forEach(c=>c.style.pointerEvents="none");
  chatArea.querySelectorAll(".cfoot").forEach(f=>f.style.display="none");
  const names=courseSelections[course.id].map(s=>s.name).join(", ");
  addUserBubble(names);
  courseIdx++;
  if(courseIdx<COURSES.length){
    const next=COURSES[courseIdx];
    const _msgs=["Looks tasty 😋","Nice pick 👍","Good choice 🎉"];
    await addBotBubble(_msgs[Math.min(courseIdx-1,_msgs.length-1)],2800);
    await addBotBubble(next.intro,2800);
    await addBotBubble(makeCourseWidget(next),3500);
    courseShowTimes[next.id]=Date.now(); // menu grid now visible

  } else {
    await addBotBubble("Good choice 🎉",2800);
    await addBotBubble("Almost there. Here's a summary of everything you've chosen. 🎊",2800);
    await addBotBubble(makeOrderSummary(),3500);
  }
}

/* ── ORDER SUMMARY ── */
function makeOrderSummary(){
  const wrap=document.createElement("div"); wrap.className="osummary";
  COURSES.forEach(c=>{
    const sel=courseSelections[c.id]; if(!sel.length) return;
    const h=document.createElement("div"); h.className="ohead"; h.textContent=c.label; wrap.appendChild(h);
    sel.forEach(s=>{
      const r=document.createElement("div"); r.className="oitem";
      r.innerHTML='<span style="flex:1">'+s.name+'</span>';
      wrap.appendChild(r);
    });
  });
  const fc=document.createElement("div"); fc.className="fc";
  const yes=document.createElement("button"); yes.className="byes"; yes.textContent="Confirm order";
  yes.addEventListener("click",onConfirm);
  const no=document.createElement("button"); no.className="bno"; no.textContent="Start over";
  no.addEventListener("click",()=>{
    document.querySelectorAll(".byes,.bno").forEach(b=>b.disabled=true);
    addUserBubble("Let me start over.");
    restartCount++;
    restartTimestamps.push(((Date.now()-studyStart)/1000).toFixed(1));
    fullSelectionLog.push({action:"restart",restart_number:restartCount,
                           elapsed_sec:((Date.now()-studyStart)/1000).toFixed(1)});
    setTimeout(hardReset,1100);
  });
  fc.appendChild(yes); fc.appendChild(no); wrap.appendChild(fc);
  return wrap;
}

async function onConfirm(){
  confirmTime=Date.now(); // record click moment
  phase="done";
  document.querySelectorAll(".byes,.bno").forEach(b=>b.disabled=true);
  addUserBubble("Confirmed.");
  await addBotBubble("Your order is all set. 🎉 Thank you so much for participating — hope you enjoy your meal.",2800);
  await addBotBubble(makeDoneCard(),3500);
  // record final session duration: runStart to Confirm click
  if(runStart) sessionDurations.push(((confirmTime-runStart)/1000).toFixed(1));
  submitData();
}

/* ── RESET ── */
function hardReset(){
  // record session duration from runStart to reset
  if(runStart) sessionDurations.push(((Date.now()-runStart)/1000).toFixed(1));
  // snapshot this session's selections before clearing
  sessionSelections.push({
    main:    courseSelections.main[0]    ? {name:courseSelections.main[0].name,    type:courseSelections.main[0].type,    cal:courseSelections.main[0].cal}    : null,
    drink:   courseSelections.drink[0]   ? {name:courseSelections.drink[0].name,   type:courseSelections.drink[0].type,   cal:courseSelections.drink[0].cal}   : null,
    dessert: courseSelections.dessert[0] ? {name:courseSelections.dessert[0].name, type:courseSelections.dessert[0].type, cal:courseSelections.dessert[0].cal} : null,
  });
  sessionCount++;
  courseIdx=0; phase="selecting"; globalOrder=0;
  courseSelections={main:[],drink:[],dessert:[]};
  presentedOrders={};
  courseShowTimes={};
  courseDecisionTimes={};
  chatArea.innerHTML="";
  runConversation();
}

/* ── START ── */
async function runConversation(){
  runStart=Date.now();
  await addBotBubble("I\'m Alex, your meal selection assistant.",2800);
  await addBotBubble("I will assist you selecting a set meal consisting of a main course, a beverage, and a dessert.🍽️",2800);
  await addBotBubble("To get started, please tell me your budget range for the main dish.",2800);
  await addBotBubble(makePriceInput(),3500);
}

function makePriceInput(){
  const wrap=document.createElement("div");
  wrap.style.cssText="display:flex;flex-direction:column;gap:8px;margin-top:4px;";

  const hint=document.createElement("span");
  hint.style.cssText="font-size:12px;color:var(--muted);";
  hint.textContent="Select your budget range:";
  wrap.appendChild(hint);

  const btnRow=document.createElement("div");
  btnRow.style.cssText="display:flex;flex-wrap:wrap;gap:7px;";

  const options=["Under $15","$15 – $25","Over $25"];
  options.forEach(opt=>{
    const b=document.createElement("button");
    b.textContent=opt;
    b.style.cssText="padding:8px 15px;border-radius:20px;border:1.5px solid var(--accent);background:#fff;color:var(--accent);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all .12s;";
    b.onmouseover=()=>{ b.style.background="var(--accent-light)"; };
    b.onmouseout=()=>{ if(!b.dataset.selected) b.style.background="#fff"; };
    b.onclick=async()=>{
      // disable all buttons
      btnRow.querySelectorAll("button").forEach(x=>{ x.disabled=true; x.style.opacity="0.4"; });
      b.style.opacity="1";
      b.style.background="var(--accent)";
      b.style.color="#fff";
      priceInput=opt;
      setTimeout(()=>wrap.remove(), 300);
      addUserBubble(opt);
      await addBotBubble("Great! Here are some main course options I think you'll like.",2800);
      // intro already covered
      await addBotBubble(makeCourseWidget(COURSES[0]),3500);
      courseShowTimes["main"]=Date.now(); // menu grid now visible
    };
    btnRow.appendChild(b);
  });

  wrap.appendChild(btnRow);
  return wrap;
}

GATE.ready.then(runConversation);

</script>
